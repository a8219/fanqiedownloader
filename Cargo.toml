[package]
name = "noveldownloader"
version = "0.2.0"
edition = "2021"
description = "Self-contained novel downloader server (Rust + Axum)"
license = "AGPL-3.0-only"

[dependencies]
anyhow = "1.0"
axum = { version = "0.7", features = ["macros"] }
base64 = "0.22"
dotenvy = "0.15"
flate2 = "1.0"
http = "1.1"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["brotli", "charset", "gzip", "http2", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
uuid = { version = "1.11", features = ["v4", "serde"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
